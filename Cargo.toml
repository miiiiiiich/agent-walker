[package]
name = "agent-walker"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Local AI coding-agent usage dashboard — tokens, cost, projects, autonomy."
license = "MIT OR Apache-2.0"
homepage = "https://github.com/miiiiiiich/agent-walker"
repository = "https://github.com/miiiiiiich/agent-walker"
readme = "README.md"
keywords = ["cli", "tui", "claude", "codex", "usage"]
categories = ["command-line-utilities", "development-tools"]
default-run = "agent-walker"

[[bin]]
name = "agent-walker"
path = "src/bin/agent-walker.rs"

[[bin]]
name = "agw"
path = "src/bin/agw.rs"

[dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4.5.60"
crossterm = "0.29.0"
ratatui = "0.30.1"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ureq = "2.12.1"
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
resvg = "0.47"
arboard = "3.6.1"

[dev-dependencies]
tempfile = "3.24.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
