[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# No installers: dist's npm installer downloads the binary from the Release
# at install time. publish-npm builds platform packages instead
# (scripts/npm_packages.py).
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Whether dist should create a Github Release or use an existing draft
create-release = false
# Whether to enable GitHub Attestations
github-attestations = true
# Extra static files to include in each App (path relative to this Cargo.toml's dir)
include = ["THIRD_PARTY_NOTICES"]
# Publish jobs to run in CI
publish-jobs = ["./publish-npm"]
# Permissions for custom jobs
github-custom-job-permissions = { "publish-npm" = { contents = "read", id-token = "write" } }
# Plan jobs to run in CI
plan-jobs = ["./draft-release"]

# Commit pins for the actions in the generated release.yml (dist's template
# names only major tags). Change them here, then `dist generate`; never in
# release.yml. Dependabot does not see this file, so on a
# cargo-dist-version bump re-pin each to the latest release of the major
# the new template uses.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
