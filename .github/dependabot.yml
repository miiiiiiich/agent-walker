version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait three days before opening a PR for a fresh release. A brand-new
    # version is the riskiest window for a typosquat or a compromised
    # publish (the `xz-utils` style of incident); this gives the ecosystem
    # time to flag it before it lands here. Major bumps wait a week.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # release.yml is generated by cargo-dist and checksum-guarded by the
      # `plan` job, so direct version bumps always fail CI. These actions
      # appear only in release.yml; their versions follow cargo-dist's
      # templates and update when cargo-dist-version is bumped (see the
      # release procedure). Security advisories still alert separately.
      - dependency-name: actions/setup-node
      - dependency-name: actions/attest
