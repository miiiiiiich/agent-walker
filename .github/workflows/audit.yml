name: Audit

# Supply-chain gate over Cargo.lock (policy and exceptions: deny.toml).
# The weekly run catches advisories published against crates already
# locked on main, which no push would otherwise surface.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # exact version: install-action verifies it against the checksum in
      # its own (SHA-pinned) manifest
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
