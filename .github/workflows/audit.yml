name: Audit

# Supply-chain gate over Cargo.lock (policy and exceptions: deny.toml).
# The weekly run catches advisories published against crates already
# locked on main, which no push would otherwise surface.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # exact version: install-action verifies it against the checksum in
      # its own (SHA-pinned) manifest
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check
