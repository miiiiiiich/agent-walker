name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # exact versions: install-action verifies them against the checksums in
      # its own (SHA-pinned) manifest
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-machete@0.9.2,typos@1.51.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo machete
      - run: typos

  # A required check: the job always runs so that it always reports, and its
  # checks run only when the scripts or a workflow that runs them changed.
  release-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # holds the base: the first parent of a pull_request's merge commit,
          # or `before` for a single-commit push
          fetch-depth: 2
      - id: changes
        name: Detect changes to the release scripts
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # an all-zero `before` (the push created the branch) or a base the
          # shallow clone does not have (e.g. a multi-commit push) counts as
          # changed
          if [ -n "${BASE//0/}" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null &&
            git diff --quiet "$BASE" HEAD -- scripts .github/workflows/ci.yml \
              .github/workflows/draft-release.yml .github/workflows/tweet-release.yml \
              .github/workflows/publish-npm.yml; then
            echo "no changes to the release scripts since $BASE; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --locked
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest -q
      - if: steps.changes.outputs.run == 'true'
        run: uv run ruff check .
      - if: steps.changes.outputs.run == 'true'
        run: uv run ruff format --check .
      - if: steps.changes.outputs.run == 'true'
        run: uv run pyright

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # actionlint runs the first shellcheck on PATH; pinned here so a runner
      # image update cannot change its findings
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shellcheck@0.11.0
      # not in install-action's manifest: the release archive is checked
      # against its published SHA-256 instead
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          echo "$PWD" >> "$GITHUB_PATH"
      # release.yml's dist-template findings are suppressed, each with its
      # reason, in .github/zizmor.yml and .github/actionlint.yaml
      - run: uvx --from 'zizmor==1.29.0' zizmor .github/workflows
      - run: actionlint
